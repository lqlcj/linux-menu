name: Verify

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.sh'
      - 'leyili.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.sh'
      - 'leyili.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi

      - name: Syntax, build and generated-file consistency
        shell: bash
        run: |
          set -euo pipefail
          bash -n build.sh
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find src -type f -name '*.sh' -print0)
          bash ./build.sh
          bash -n leyili.sh
          git diff --check
          git diff --exit-code -- leyili.sh

      - name: ShellCheck
        run: shellcheck --severity=error --shell=bash build.sh leyili.sh tests/smoke.sh

      - name: Smoke tests
        run: bash tests/smoke.sh
